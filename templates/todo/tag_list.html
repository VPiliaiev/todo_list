{% extends "base.html" %}

{% block content %}
  <h1 class="d-flex justify-content-between align-items-center">
    Tags
    <a href="{% url 'todo:tag-create' %}" class="btn btn-primary">Add tag</a>
  </h1>

  <table class="table table-striped">
    <thead>
    <tr>
      <th>Name</th>
      <th>Update</th>
      <th>Delete</th>
    </tr>
    </thead>
    <tbody>
    {% for tag in tags %}
      <tr>
        <td>{{ tag.name }}</td>
        <td>
          <a href="{% url 'todo:tag-update' tag.id %}" class="btn btn-primary btn-sm">Update</a>
        </td>
        <td>
          <a href="{% url 'todo:tag-delete' tag.id %}" class="btn btn-danger btn-sm">Delete</a>
        </td>
      </tr>
    {% empty %}
      <tr>
        <td colspan="3">No tags yet.</td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
{% endblock %}
