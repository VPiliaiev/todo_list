{% extends "base.html" %}
{% load crispy_forms_filters %}
{% load crispy_forms_tags %}

{% block content %}
  <h2>{% if form.instance.pk %}Update{% else %}Add{% endif %} Tag</h2>
  <form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <div class="mt-3">
      <button type="submit" class="btn btn-success">
        {% if form.instance.pk %}Update{% else %}Create{% endif %}
      </button>
      <a href="{% url 'todo:tag-list' %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
{% endblock %}
